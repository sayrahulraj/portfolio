
name: Build Angular Portfolio

on:
  push:
    branches:
      - main

  workflow_dispatch:

  repository_dispatch:
    types:
      - portfolio-data-updated

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout public portfolio repository
      - name: Checkout Portfolio
        uses: actions/checkout@v7
        with:
          path: portfolio

      # Step 2: Checkout private portfolio-data repository
      - name: Checkout Private Portfolio Data
        uses: actions/checkout@v7
        with:
          repository: sayrahulraj/portfolio-data
          token: ${{ secrets.PORTFOLIO_DATA_TOKEN }}
          path: portfolio-data

      # Step 3: Copy JSON files
      - name: Copy Portfolio Data
        run: |
          mkdir -p portfolio/src/app/core/data
          cp -R portfolio-data/rahul-raj/data/. portfolio/src/app/core/data/

      # Step 4: Copy images and other assets
      - name: Copy Portfolio Assets
        run: |
          mkdir -p portfolio/src/assets/images
          cp -R portfolio-data/rahul-raj/assets/. portfolio/src/assets/images/

      # Step 5: Verify copied files
      - name: Verify Portfolio Data
        run: |
          echo "JSON files:"
          ls -la portfolio/src/app/core/data/

          echo "Images and assets:"
          ls -la portfolio/src/assets/images/

      # Step 6: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      # Step 7: Install dependencies
      - name: Install Dependencies
        working-directory: portfolio
        run: npm ci

      # Step 8: Build Angular application
      - name: Build Angular Application
        working-directory: portfolio
        run: npm run build

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

